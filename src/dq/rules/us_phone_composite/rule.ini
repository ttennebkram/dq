[rule]
description = standard text checks followed by US phone syntax

# Each line is an alternative. Matching uses complete, case-insensitive field
# name components, so phone_t matches but microphone_text does not.
automatic_field_types = text
automatic_field_name_patterns =
    phone
    mobile
    telephone
    tel

[composite_rule]
rules =
    standard_text_composite
    us_phone_base
