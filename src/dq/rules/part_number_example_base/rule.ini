[rule]
# The rule name is taken from the directory name.

# Short text displayed by bin/dq --list_rules.
description = Part number example: three letters, a dash, and six digits

# Controls which records are written to the CSV output.
# Choices: match or no_match. Required; there is no default.
report = no_match

[regex:regex01]
# Path to one .regex file, relative to this INI file.
regex_file = part_number_example.regex

# Controls whether letter case must match.
# Choices: true or false. Default: true.
case_sensitive = false

# Controls whether the entire value or any part of it must match.
# Choices: full or partial. Default: full.
# match_mode = full

# Controls whether ^ and $ apply to each line.
# Choices: true or false. Default: false.
# multiline = false

# Controls whether whitespace and # comments are formatting or pattern text.
# Choices: verbose or compact. Default: verbose.
# regex_format = verbose
