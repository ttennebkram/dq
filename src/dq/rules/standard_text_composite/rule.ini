[rule]
description = missing, empty, whitespace, and unusual Unicode checks

# Automatically use this fallback composite for text/string fields when no
# more specific composite rule's field-name patterns match.
automatic_field_types = text

[composite_rule]
rules =
    missing_fields_base
    empty_strings_base
    whitespace_only_base
    surrounding_whitespace_base
    code_points_base
